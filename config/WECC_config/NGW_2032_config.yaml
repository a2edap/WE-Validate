time:
  window:
    # validation period start time
    start: 2018-07-01 00:00:00
    # validation period end time
    end: 2018-12-31 00:00:00

# validation metrics to be calculated and plotted
metrics:
  - rmse
  - crmse
  - bias
  - mae
  - cross_correlation

# analysis type (base or swingdoor)
analysis:
  - base_analysis
  # - swingdoor-mag
  # - swingdoor-ramp
  # - swingdoor-dur

ramping: #turn on save_ramping_comparison in output 
    #specify threshold value for maximum deviation 
    threshold: .1
    # comparison period start time
    start: 2016-08-02 02:50:00
    # comparison period end time
    end: 2016-08-02 06:20:00

aggregation:
  - YE
  - MS
  # - QS-DEC #meteorological seasons (DJF, MAM, JJA, SON)
  # - W
  # - D
  # - H

daynight:
  # classify timestamps as day/night using sunrise/sunset from specified location
  classify: False
  # latitude of the location
  latitude: 45.87
  # longitude of the location
  longitude: -120.27
  #specify timezone of the location
  timezone: America/Los_Angeles


# power plant capacity. should have same units as reference.Add commentMore actions
# used to normalize average percent bias (bias_pct) and mean average percent error (mae_pct)
# If left blank, will be calculated from the max of the baseline dataset
capacity: 

# output
output:
  # output folder path
  path: output/NGW
  # name of the run
  org: NGW 2032
  # save metrics?
  save_metrics: True
  # save figures?
  save_figs: True
  # show figures?
  show_figs: False 
  # print results
  print_results : True
  # print time steps with NaN values 
  print_NaN_values: False
  # save results to pdf? 
  save_to_pdf: True
  # save ramping comparison to pdf?
  save_ramping_comparison: False

# baseline dataset
base:
  # name of dataset
  name: EIA 930 NGW
  # data directory
  path: data/WECC_wind_data/EIA_NGW_cleaned.csv
  # name of data processing function
  function: csv
  # variable name
  var: Measured_CF
  # data frequency in minutes
  freq: 60
  # flag value
  flag: -9999

# data input to be compared with the baseline dataset
comp:
  # name of dataset
  - name: NGW 2032
    # data directory
    path: data/WECC_wind_data/2032_cf_profiles.csv
    # name of data processing functioncc
    function: csv
    # variable names
    var: Glacier Winds Energy Two69WT103.5
    # data frequency in minutes
    freq: 60
    # flag value
    flag: 999


# reference
reference: 
  # variable name to be displayed
  var: Capacity Factor
  # variable units
  units: percent
  # Method for selecting data points when frequencies differ between datasets. ("instance" or "average")
  select_method: instance