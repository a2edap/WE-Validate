    # name of data processing function
    function: csv
    # variable name
    var: value
    # data frequency in minutes
    freq: 60
    # flag value
    flag: 999

  # name of dataset
  - name: HRRR REV 3 A1
    # data directory
    path: data/Forest_Creek_Wind/Forest Creek Wind Farm LLC_3_A1.csv
    # name of data processing function
    function: csv
    # variable name
    var: value
    # data frequency in minutes
    freq: 60
    # flag value
    flag: 999

  # name of dataset
  - name: HRRR REV 4 A1
    # data directory
    path: data/Forest_Creek_Wind/Forest Creek Wind Farm LLC_4_A1.csv
    # name of data processing function
    function: csv
    # variable name
    var: value
    # data frequency in minutes
    freq: 60
    # flag value
    flag: 999

  # name of dataset
  - name: HRRR REV 5 A1
    # data directory
    path: data/Forest_Creek_Wind/Forest Creek Wind Farm LLC_5_A1.csv
    # name of data processing function
    function: csv
    # variable name
    var: value
    # data frequency in minutes
    freq: 60
    # flag value
    flag: 999

  # name of dataset
  - name: HRRR REV 6 GEN
    # data directory
    path: data/Forest_Creek_Wind/Forest Creek Wind Farm LLC_6_gen.csv
