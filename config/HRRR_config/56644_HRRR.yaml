time:
  window:
    # validation period start time
    start: 2018-1-01 06:00:00
    # validation period end time
    end: 2018-12-31 23:45:00

# validation metrics to be calculated and plotted
metrics:
  - rmse
  - crmse
  - bias
  - mae
  # - bias_pct
  # - mae_pct
  - cross_correlation
  # - ovl 

# analysis type (base or swingdoor)
analysis:
  - base_analysis
  # - swingdoor-mag
  # - swingdoor-ramp
  # - swingdoor-dur

ramping: #turn on save_ramping_comparison in output 
    #specify threshold value for maximum deviation 
    threshold: .1
    # comparison period start time
    start: 2016-08-02 02:50:00
    # comparison period end time
    end: 2016-08-02 06:20:00


aggregation:
  - YE
  - MS
  # - QS-DEC #meteorological seasons (DJF, MAM, JJA, SON)
  # - D
  # - H

daynight:
  # classify timestamps as day/night using sunrise/sunset from specified location
  classify: False
  # latitude of the location
  latitude: TEMP_LATITUDE
  # longitude of the location
  longitude: TEMP_LONGITUDE
  #specify timezone of the location
  timezone: US/Central
  #specify timezone of the data if different from location timezone
  data_timezone: UTC

# power plant capacity. should have same units as reference.
# used to normalize average percent bias (bias_pct) and mean average percent error (mae_pct)
# If left blank, will be calculated from the max of the baseline dataset
capacity:  120

# output
output:
  # output folder path
  path: output/ERCOT_HRRR/56644
  # name of the run
  org: ERCOT HRRR 56644 2018
  # save metrics?
  save_metrics: True
  # save figures?
  save_figs: True
  # show figures?
  show_figs: False
  # print results?
  print_results : True
  # print time steps with NaN values 
  print_NaN_values: False
  #write to a pdf?
  save_to_pdf: True
  # save ramping comparison to pdf?
  save_ramping_comparison: False

# baseline dataset
base:
  # name of dataset
  name: ERCOT 56644
  # data directory
  path: data/ERCOT_yearly_data_hsl_2018/ercot_timeseries_56644_2018_hsl.csv
  # name of data processing function
  function: csv
  # variable name
  var: cap_factor
  # data frequency in minutes
  freq: 15
  # flag value
  flag: 999

# data input to be compared with the baseline dataset
comp:

  # name of dataset
  - name: HRRR 1
    # data directory
    path: data/rev_HRRR_data/56644/56644_1.5sle_1.csv
    # name of data processing function
    function: csv
    # variable name
    var: cf_reV
    # data frequency in minutes
    freq: 60
    # flag value
    flag: -9999

  # name of dataset
  - name: HRRR 2
    # data directory
    path: data/rev_HRRR_data/56644/56644_1.5sle_2.csv
    # name of data processing function
    function: csv
    # variable name
    var: cf_reV
    # data frequency in minutes
    freq: 60
    # flag value
    flag: -9999

  # name of dataset
  - name: HRRR 3
    # data directory
    path: data/rev_HRRR_data/56644/56644_1.5sle_3.csv
    # name of data processing function
    function: csv
    # variable name
    var: cf_reV
    # data frequency in minutes
    freq: 60
    # flag value
    flag: -9999

  # name of dataset
  - name: HRRR 4
    # data directory
    path: data/rev_HRRR_data/56644/56644_1.5sle_4.csv
    # name of data processing function
    function: csv
    # variable name
    var: cf_reV
    # data frequency in minutes
    freq: 60
    # flag value
    flag: -9999

  # name of dataset
  - name: PLUSWIND
    # data directory
    path: data/pluswind_data_yearly_2018/pluswind_timeseries_56644_2018.csv
    # name of data processing function
    function: csv
    # variable name
    var: cap_factor
    # data frequency in minutes
    freq: 15
    # flag value
    flag: -9999

# reference
reference: 
  # variable name to be displayed
  var: Capacity Factor
  # variable units
  units: '%'
  #instance or average sampling if frequencies not the same 
  select_method: average